<app-loader [loading]="loading">
    <div class="modal-header">
        <div>
            <p class="ht1 mb-2">{{!isUpdate ? 'Create UDF' : 'Edit UDF'}} </p>
            <p class="ht2 mb-0">Enter the required details for creating a user defined function</p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"
            (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body">
        <form [formGroup]="udfForm">
            <div class="row">
                <div class="col-12">
                    <div class="form-group">
                        <label for="udfName" class="p2">UDF Name*</label>
                        <input type="text" class="form-control textbox-color" formControlName="udfName"
                            placeholder="Enter UDF Name">
                        <div class="text-error pd-t-4"
                            *ngIf="udfForm.get('udfName').hasError('required') && udfForm.get('udfName').touched">
                            UDF Name is required
                        </div>
                        <!-- <div class="" *ngIf="fg.get('oldPassword').hasError('required') && fg.get('oldPassword').touched">
                            Password is required
                        </div> -->
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-group">
                        <label for="inputType" class="p2">Query language*</label>
                        <ng-select [clearable]="false" id="data-type" formControlName="language" class="custom">
                            <ng-option value="Pyspark" selected>Pyspark</ng-option>
                        </ng-select>
                        <div class="text-error pd-t-4"
                            *ngIf="udfForm.get('language').hasError('required') && udfForm.get('language').touched">
                            Language is required
                        </div>
                    </div>
                </div>

            </div>

            <div class="row tp-br">
                <!-- <div class="col-xl-12">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                            [value]="false" [(ngModel)]="isUploadLogic" [ngModelOptions]="{standalone: true}"
                            [checked]="true">
                        <label class="form-check-label" for="inlineRadio1">Input logic</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                            [value]="true" [(ngModel)]="isUploadLogic" [ngModelOptions]="{standalone: true}"
                            [checked]="true">
                        <label class="form-check-label" for="inlineRadio2">Upload logic</label>
                    </div>
                </div> -->

                <div class="col-xl-12 mr-t-12" *ngIf="!isUploadLogic">
                    <label class="p2" for="inlineRadio1">Input logic*</label>
                    <textarea class="form-control textbox-color" id="udfdefination" formControlName="udfscript"
                        placeholder="Input logic" rows="4"></textarea>
                    <div class="text-error pd-t-4"
                        *ngIf="udfForm.get('udfscript').hasError('required') && udfForm.get('udfscript').touched">
                        Input logic is required
                    </div>
                </div>
                <div class="col-xl-12" [class.disabled-input]="!isUploadLogic" *ngIf="isUploadLogic">
                    <div style="height: 100px;">
                        <div class="col-xl-12 col-lglg-12 col-md-12 col-sm-12 col-12 show">
                            <input id="file" tabindex="-1" name="file" type="file" class="custom-file-input"
                                id="customFile" accept=".csv" enctype="multipart/form-data" multiple #file title="" />
                            <label class="custom-file-label upload-file textbox-color" for="customFile"
                                style="height: 100px;">
                                Upload Logic
                                <img src="assets/img/upload-icon.svg" width="18">
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" style="margin-top: 10px;">
                <div class="col-6">
                    <div class="form-group mr-b-0">
                        <label for="returnDataType" class="p2">Return data type*</label>
                        <input type="text" class="form-control textbox-color" formControlName="dataType"
                            placeholder="Enter return data type*">
                        <div class="text-error pd-t-4"
                            *ngIf="udfForm.get('dataType').hasError('required') && udfForm.get('dataType').touched">
                            DataType is required
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="form-group mr-b-0">
                        <label for="udfSyntax" class="p2">UDF Syntax*</label>
                        <input type="text" class="form-control textbox-color" formControlName="udfSyntax"
                            placeholder="Enter UDF Syntax*">
                        <div class="text-error pd-t-4"
                            *ngIf="udfForm.get('udfSyntax').hasError('required') && udfForm.get('udfSyntax').touched">
                            UDF Syntax is required
                        </div>
                    </div>
                </div>
            </div>

            <div class="row btn-div">
                <div class="col-xl-12 mb-3">
                    <button class="btn btn-design disableAdd" [disabled]="udfForm.invalid" (click)="create()"
                        [ngClass]="{'validBtn': !udfForm.invalid}">{{isUpdate ? 'UPDATE' : 'Create'}}</button>
                </div>
            </div>
        </form>
    </div>
</app-loader>
