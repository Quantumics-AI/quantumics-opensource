<app-loader [loading]="loading">
    <form [formGroup]="fg">
        <div class="modal-body">
            <div class="head-div">
                <div class="dib">
                    <p class="mr-b-0 h1">Edit flow</p>
                    <p class="h2 mr-b-0 mr-t-8">Edit flow basic details like name & description.</p>
                </div>
                <div class="float-right">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"
                        (click)="modal.dismiss('Cross click')">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            </div>
            <div class="row mr-t-16">
                <div class="col-12">
                    <div class="form-group">
                        <label for="flowName" class="p2">Flow name*</label>
                        <input type="text" class="form-control input-design" id="flowName" minlength="3" maxlength="20"
                            formControlName="flowName" disabled>
                        <small id="dataflowNameHelp" class="form-text body-text-muted">
                            Flow name must be between 3 and 20 characters long.
                        </small>
                        <div
                            *ngIf="fg.get('flowName').invalid && fg.get('flowName').dirty || fg.get('flowName').touched">
                            <div class="text-error" *ngIf="fg.get('flowName').hasError('required')">
                                flow name is required.
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="dataFlowDescription" class="p2">Data flow description</label>
                        <textarea class="form-control input-design resize-none" id="description" rows="3"
                            maxlength="255" placeholder="Flow Description" formControlName="description"></textarea>
                    </div>
                </div>

                <div class="col-12 btn-div">
                    <button [disabled]="fg.invalid" id="btnSave" type="button" class="btn btn-design"
                        (click)="edit()">Save</button>
                </div>
            </div>
        </div>
    </form>
</app-loader>
