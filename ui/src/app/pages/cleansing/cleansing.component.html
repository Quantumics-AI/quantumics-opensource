<app-loader [loading]="loading">
    <div class="main-container" style="background-color: #F0F4F7;">
        <div class="row page-header1 mr-0">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb breadcrumb-top">
                    <!-- <li class="breadcrumb-item"><a [routerLink]="['/projects', projectId, 'stats']">{{projectName}}</a>
                    </li> -->
                    <li class="breadcrumb-item"><a (click)="back()">Preparation</a></li>
                    <li class="breadcrumb-item"><a (click)="redirectToFolder()">{{folderName}}</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">{{file}}</li>
                </ol>
            </nav>
        </div>

        <div class="page-content">
            <div class="mb-2">
                <app-cleansing-toolbar (editor)="viewChange($event)" [appliedRuleCount]="appliedRuleCount" [resetMenuTopbarColor]="resetMenuTopbarColor">
                </app-cleansing-toolbar>
            </div>

            <div class="left-penal bg-w" [class.cleansing-table]="highlightedColumnIndex === -1 || highlightedColumnIndex !== 0"  [ngStyle]="{'width': showFullView ? '100%' : '76%'}"  id="table" data-effect="fadeOut">
                <div class="cleansing-tbl table-responsive auto-height br-b">
                    <table class="table table-fixed table-striped">
                        <thead *ngIf="showPreview">
                            <tr class="th-center">
                                <ng-container *ngFor="let column of newColumns">
                                    <th *ngIf="!column.preview" style="border: none"> </th>
                                    <th *ngIf="column.preview === 'old'" class="source-preview source-view">
                                        Source
                                    </th>
                                    <th *ngIf="column.preview === 'keep'" class="source-preview source-view">
                                        Source
                                    </th>
                                    <th class="source-preview source-pre" *ngIf="column.preview === 'new'">
                                        Preview
                                    </th>
                                </ng-container>
                            </tr>
                        </thead>
                        <thead class="thead-light">
                            <tr class="th-center fixed-th">
                                <th *ngFor="let column of newColumns; let isFirst = first; let i = index" class="th-new"
                                    (click)="highlightColumn(i)"
                                    [ngClass]="{ headerWithBorder: highlightedColumnIndex === i }" 
                                    (click)="onColumnSelect(column.column_name)">
                                    <div class="d-flex fix-contetnt">
                                        <span class="mr-1"
                                            *ngIf="column.data_type === 'int' || column.data_type === 'bigint'">
                                            <img src="assets/img/preparation/number-icon.svg" class="align-bottom" />
                                        </span>
                                        <span class="mr-1" *ngIf="column.data_type === 'string'">
                                            <img src="assets/img/preparation/string-icon.svg" class="align-bottom" />
                                        </span>
                                        <span class="mr-1"
                                            *ngIf="column.data_type === 'double' || column.data_type === 'float'">
                                            <img src="assets/img/preparation/number-icon.svg" class="align-bottom" />
                                        </span>

                                        <span role="button">
                                            {{column.column_name}}
                                        </span>
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="td-b cleansing-tr-padding"
                                *ngFor="let d of data | slice: startIndex:endIndex; let i = index; let isLast = last"
                                [style.background-color]="rowPreview(d)">
                                <td class="cleansing-td-padding" *ngFor="let column of newColumns; let j=index;"
                                    [ngStyle]="{'background': column.preview == 'new' ? '#FFFBDC' : column.preview == 'old' ? '#DFFAF5':''}"
                                    [ngClass]="{ highlighted: highlightedColumnIndex === j, lastRowWithBorder: isLast && highlightedColumnIndex === j }">
                                    <span *ngIf="isPIIColumn(column.column_name); else normal">
                                        {{ d[column.column_name].slice(0,5) }}**********
                                    </span>
                                    <ng-template #normal>
                                        {{ d[column.column_name] }}
                                    </ng-template>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div *ngIf="rowLength" class="p1 pd-t-l-16">
                    <!-- <span> <img src="assets/media/image/eye.svg" class="mr-2" alt="" />
                        {{columnLength}}
                        Columns &nbsp; &nbsp; {{rowLength}} Rows &nbsp; &nbsp;{{uniqueDatatypes}}</span> -->
                    <div class="dif">
                        <!-- <span class="mr-r-27"><img src="/assets/img/preparation/eye-icon.svg" alt="" /> Show/ Hide columns</span> -->
                        <span class="mr-r-27">{{columnLength}} Columns</span>
                        <span class="mr-r-27">{{rowLength}} Rows</span>
                        <span>{{uniqueTypes.length}} Data Types</span>
                    </div>

                    <div class="float-right pd-r-26">
                        <span class="mr-r-27">Rows per page: 100</span>
                        <span class="mr-r-18">
                            {{ getRange() }}
                        </span>
                        <!-- <span class="mr-r-18"><img src="/assets/img/preparation/left-arrow-light.svg" alt="" /></span>
                        <span><img src="/assets/img/preparation/right-arrow-dark.svg" alt="" /></span> -->
                        <ngb-pagination class="custom" [collectionSize]="data?.length" [(page)]="page"
                            [pageSize]="pageSize" (pageChange)="onPageChange($event)">
                            <ng-template ngbPaginationPrevious>
                                <span class="pagination-arrow" [ngClass]="{ 'disabled': page === 1 }">
                                    <img src="/assets/img/preparation/left-arrow-dark.svg" alt="" />
                                </span>
                            </ng-template>
                            <ng-template ngbPaginationNext>
                                <span class="pagination-arrow" [ngClass]="{ 'disabled': page === totalPages }">
                                    <img src="/assets/img/preparation/right-arrow-dark.svg" alt="" />
                                </span>
                            </ng-template>
                        </ngb-pagination>
                    </div>
                </div>
            </div>
            <div *ngIf="!showFullView" class="right-penal pb-2">
                <a class="close-icon" (click)="showFullView = true;cancelPreview(false);highlightedColumnIndex=-1"><img
                        src="assets/media/preparation/close.svg"></a>

                <div [ngSwitch]="editorComponent">
                    <div *ngSwitchCase="'rules'">
                        <app-rules-catelogue (edit)="edit($event)" (deleted)="ruleDeleted($event)" [rules]="rules"
                            (sequenceChanged)="sequenceChanged()" (cancel)="cancelPreview($event)">
                        </app-rules-catelogue>
                    </div>
                    <div *ngSwitchCase="'columnAnalysis'">
                        <div style="height: 500px; overflow: scroll;">
                            <app-column-analysis [userId]="userId" [projectId]="projectId" [folderId]="folderId" 
                            [fileId]="fileId" [column]="columnName" [recordCount]="data.length"></app-column-analysis>
                        </div>
                    </div>
                    <div *ngSwitchDefault>
                        <app-rules-editor-container *ngIf="editorComponent !== 'rules'"
                            [editorComponent]="editorComponent" [ruleInputLogic1]="ruleInputLogic1"
                            [columns]="newColumns" [selectedRule]="selectedRule" (previewRule)="previewRuleNew($event)"
                            (cancelPreview)="cancelPreview($event)" (addRule)="addRule($event)"
                            [piiColumns]="piiColumns">
                        </app-rules-editor-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</app-loader>
