<div class="ml-0 mr-0 row" >
    <div class="cleansing-toolbar d-flex pd-l-r-12 col">
        <button mat-button [matMenuTriggerFor]="mainMenu" class="border-0 bg-white menu-spacing br-first"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 0 ? activeImages[0] : inActiveImages[0] }}" alt="filterRowsRule"
                height="45">
        </button>
        <mat-menu #mainMenu="matMenu" class="custom-menu">
            <button mat-menu-item [matMenuTriggerFor]="submenu1">On column values</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('filterRows', filterRuleTypes.TopRows); activeMenuIndex = 0;">Rows from
                top</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRows', filterRuleTypes.Range); activeMenuIndex = 0;">Row in
                range</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRows', filterRuleTypes.RegularInterval); activeMenuIndex = 0;">Rows
                at
                regular interval</button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="setEditorComponent('removeDuplicateRows'); activeMenuIndex = 0;">Remove
                duplicate rows</button>
        </mat-menu>
        <mat-divider></mat-divider>
        <mat-menu #submenu1="matMenu">
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.IsMissing); activeMenuIndex = 0;"
                class="child-menu-item">Is missing</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.TypeMismatched); activeMenuIndex = 0;">Is
                mismatched</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.EqualTo); activeMenuIndex = 0;">Is
                exactly</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.NotEqualTo); activeMenuIndex = 0;">Is
                not</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.IsOneOf); activeMenuIndex = 0;">Is
                one
                of</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.LessThanOrEqualTo); activeMenuIndex = 0;">Less
                than (or equal to)</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.GreaterThanOrEqualTo); activeMenuIndex = 0;">Greater
                than
                (or equal to)</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.IsBetween); activeMenuIndex = 0;">Is
                between</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.Contains); activeMenuIndex = 0;">Contains</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.StartsWith); activeMenuIndex = 0; ">Starts
                with</button>
            <button mat-menu-item
                (click)="setEditorComponent('filterRowsByColumn', filterRuleTypes.EndsWith); activeMenuIndex = 0;">Ends
                with</button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="replaceMainMenu" class="border-0 bg-white menu-spacing"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 1 ? activeImages[1] : inActiveImages[1] }}" alt="ReplaceRule" height="45">
        </button>
        <mat-menu #replaceMainMenu="matMenu" class="custom-menu">
            <button mat-menu-item (click)="setEditorComponent('patternReplace'); activeMenuIndex = 1;">Text or
                pattern</button>
            <button mat-menu-item (click)="setEditorComponent('findReplace'); activeMenuIndex = 1;">Cell</button>
            <button mat-menu-item (click)="setEditorComponent('fillNull'); activeMenuIndex = 1;">Missing</button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="extractMainMenu" class="border-0 bg-white menu-spacing"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 2 ? activeImages[2] : inActiveImages[2] }}" height="45" alt="ExtractRule">
        </button>
        <mat-menu #extractMainMenu="matMenu" class="custom-menu">
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.TextOrPattern); activeMenuIndex = 2;">Text
                or
                Pattern</button>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.Numbers); activeMenuIndex = 2;">Numbers</button>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.QueryStrings); activeMenuIndex = 2;">Query
                strings</button>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.TypeMismatched); activeMenuIndex = 2;">Mismatched</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.BetweenDelimiters); activeMenuIndex = 2;">Between
                delimiters</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.FirstCharacters); activeMenuIndex = 2;">First
                characters</button>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.LastCharacters); activeMenuIndex = 2;">Last
                characters</button>
            <button mat-menu-item
                (click)="setEditorComponent('extractColumnValues', extractRuleTypes.CharactersBetweenPostions); activeMenuIndex = 2;">Characters
                between positions</button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="splitMainMenu" class="border-0 bg-white menu-spacing"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 3 ? activeImages[3] : inActiveImages[3] }}" height="45" alt="SplitRule">
        </button>
        <mat-menu #splitMainMenu="matMenu" class="custom-menu">
            <button mat-menu-item
                (click)="setEditorComponent('split', splitRuleTypes.ByDelimiter); activeMenuIndex = 3;">On
                delimiter</button>
            <button mat-menu-item
                (click)="setEditorComponent('split', splitRuleTypes.BetweenDelimiter); activeMenuIndex = 3;">Between
                two
                delimiter</button>
            <button mat-menu-item
                (click)="setEditorComponent('split', splitRuleTypes.ByPositions); activeMenuIndex = 3;">At
                positions</button>
            <button mat-menu-item
                (click)="setEditorComponent('split', splitRuleTypes.BetweenTwoPositions); activeMenuIndex = 3;">Between
                positions</button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="mergeMainMenu" class="border-0 bg-white menu-spacing"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 4 ? activeImages[4] : inActiveImages[4] }}" height="45" alt="MergeRule">
        </button>
        <mat-menu #mergeMainMenu="matMenu" class="custom-menu">
            <button mat-menu-item
                (click)="setEditorComponent('mergeRule', mergeRuleTypes.Multiple); activeMenuIndex = 4;">Multiple</button>
            <button mat-menu-item
                (click)="setEditorComponent('mergeRule', mergeRuleTypes.Range); activeMenuIndex = 4;">Range</button>
        </mat-menu>

        <!-- Format  -->

        <button mat-button [matMenuTriggerFor]="formatMainMenu" class="border-0 bg-white menu-spacing"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 5 ? activeImages[5] : inActiveImages[5] }}" height="45"
                alt="FormtRowsRule">
        </button>
        <mat-menu #formatMainMenu="matMenu" class="custom-menu w-300">
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.Upper); activeMenuIndex = 5;">Convert to
                uppercase</button>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.Lower); activeMenuIndex = 5;">Convert to
                lowercase</button>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.Proper); activeMenuIndex = 5;">Convert to
                proper
                case</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.TrimWhitespace); activeMenuIndex = 5;">Trim
                leading
                and trailing whitespaces</button>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.TrimQuotes); activeMenuIndex = 5;">Trim
                leading and trailing quotes
            </button>

            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.RemoveWhitespaces); activeMenuIndex = 5;">Remove
                whitespace</button>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.RemoveSpecialCharacters); activeMenuIndex = 5;">Remove symbols</button>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.RemoveAccents); activeMenuIndex = 5;">Remove
                accents</button>

            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.AddPrefix); activeMenuIndex = 5;">Add
                prefix</button>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.AddSuffix); activeMenuIndex = 5;">Add
                suffix</button>
            <mat-divider></mat-divider>
            <button mat-menu-item
                (click)="setEditorComponent('format', formatRuleTypes.PadWithLeadingCharacters); activeMenuIndex = 5;">Pad
                text with leading characters</button>
        </mat-menu>

        <button mat-button (click)="setEditorComponent('standardize'); activeMenuIndex = 6;"
            class="border-0 bg-white menu-spacing">
            <img src="{{ activeMenuIndex === 6 ? activeImages[6] : inActiveImages[6] }}" height="45"
                alt="StandardiseRule">
        </button>

        <button mat-button [matMenuTriggerFor]="ManagecolumnsMenu" class="border-0 bg-white menu-spacing">
            <img src="{{ activeMenuIndex === 7 ? activeImages[7] : inActiveImages[7] }}" height="45" alt="ManageRule">
        </button>

        <mat-menu #ManagecolumnsMenu="matMenu" class="custom-menu">
            <button mat-menu-item
                (click)="setEditorComponent('manageColumns', manageColumnRuleTypes.Create); activeMenuIndex = 7;">Create
                column</button>
            <button mat-menu-item
                (click)="setEditorComponent('manageColumns', manageColumnRuleTypes.Clone); activeMenuIndex = 7;">Clone
                column</button>
            <button mat-menu-item
                (click)="setEditorComponent('manageColumns', manageColumnRuleTypes.DataTypeCast); activeMenuIndex = 7;">Cast
                data type</button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="countMatchesMenu" class="border-0 bg-white br-last"
            (click)="activeMenuIndex = -1">
            <img src="{{ activeMenuIndex === 8 ? activeImages[8] : inActiveImages[8] }}" height="45"
                alt="CountMatches Rule">
        </button>
        <mat-menu #countMatchesMenu="matMenu" class="custom-menu">
            <button mat-menu-item
                (click)="setEditorComponent('countMatch', countMatchRuleTypes.Text); activeMenuIndex = 8;">Text or
                pattern</button>
            <button mat-menu-item
                (click)="setEditorComponent('countMatch', countMatchRuleTypes.Delimiter); activeMenuIndex = 8;">Between
                delimiters</button>
        </mat-menu>
        <button class="border-0 bg-white br-last ml-4 mt-1"
        (click)="setEditorComponent('rowId'); activeMenuIndex = 9;">
            <img src="{{ activeMenuIndex === 9 ? activeImages[9] : inActiveImages[9] }}" height="45"
                alt="RowId Rule">
        </button>
    </div>

    <div class="cleansing-toolbar applied-count mr-l-r-6 col mw-61" (click)="setEditorComponent('rules')" role="button" [class.disabled]="!appliedRuleCount">
        <div class="circle mr-l-4" [ngClass]="{'activeCount': appliedRuleCount}">
            <div class="counter-content">
                <p class="mr-0">{{appliedRuleCount ?? 0}}</p>
            </div>
        </div>
        <p class="applied-text">Applied</p>
    </div>

    <div class="cleansing-toolbar pd-12 col mw-106">
        <button class="btn btn-design" [disabled]="!appliedRuleCount || hasJobRunning" [ngClass]="{'disableRunJob': !appliedRuleCount}"
            (click)="runJob();">Run Job</button>
    </div>

</div>
