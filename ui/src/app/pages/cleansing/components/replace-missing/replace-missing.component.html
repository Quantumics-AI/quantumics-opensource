<div class="preparation-heading">
    <h6 class="p2">Replace missing</h6>
    <p class="p1 mr-b-0">Select the respected column from the dataset and replace the text or pattern.</p>
    <hr class="cleansing-divider">
</div>

<form [formGroup]="fg" (ngSubmit)="saveRule()">
    <!-- Commented for release 1 -->
    <!-- 
    <div class="col-12">
        <div class="form-group">
            <label for="selection-type">Type</label>
            <small class="form-text text-muted pull-right"></small>
            <select id="selection-type" class="form-control" [(ngModel)]="ruleInputValues"
                formControlName="ruleInputValues">
                <option *ngFor="let op of selectionTypes" [value]="op.value">{{op.title}}</option>
            </select>
        </div>
    </div> -->

    <ng-container [ngSwitch]="ruleInputValues">
        <ng-container *ngSwitchCase="selectionType.Multiple">
            <div class="col-12">
                <div class="form-group">
                    <label for="selectColumn" class="p2 fs-12">Column*</label>
                    <ng-select id="selectColumn" [(ngModel)]="ruleImpactedCols" formControlName="ruleImpactedCols"
                        [multiple]="false" (change)="change($event)" placeholder="Select column"
                        [dropdownPosition]="'bottom'" [closeOnSelect]="true" [items]="columns" bindLabel="column_name"
                        bindValue="column_name" class="custom">
                        <ng-template ng-option-tmp let-item="item">
                            <span [title]="item.column_name">{{item.column_name}}</span>
                        </ng-template>
                    </ng-select>

                    <ng-container *ngIf="fg.get('ruleImpactedCols').touched">
                        <span class="text-error" *ngIf="fg.get('ruleImpactedCols').hasError('required')">
                            This field is required
                        </span>
                    </ng-container>
                </div>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="selectionType.Range">
            <div class="col-12">
                <div class="form-group">
                    <label for="start-column" class="p2 fs-12">Start Column*</label>
                    <ng-select id="start-column" class="custom" [(ngModel)]="ruleInputValues1"
                        formControlName="ruleInputValues1">
                        <ng-option *ngFor="let col of columns; let i = index;" [value]="i">
                            {{col.column_name}}</ng-option>
                    </ng-select>

                    <ng-container *ngIf="fg.get('ruleInputValues1').touched">
                        <span class="text-error" *ngIf="fg.get('ruleInputValues1').hasError('required')">
                            This field is required
                        </span>
                    </ng-container>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <label for="end-column" class="p2 fs-12">End Column*</label>
                    <ng-select id="end-column" class="custom" [(ngModel)]="ruleInputValues2"
                        formControlName="ruleInputValues2" (change)="preview()">
                        <ng-option *ngFor="let col of columns; let i = index;" [value]="i">
                            {{col.column_name}}</ng-option>
                    </ng-select>
                    <ng-container *ngIf="fg.get('ruleInputValues2').touched">
                        <span class="text-error" *ngIf="fg.get('ruleInputValues2').hasError('required')">
                            This field is required
                        </span>
                    </ng-container>
                </div>
            </div>
        </ng-container>
    </ng-container>
    <div class="col-12">
        <div class="form-group">
            <label for="replaceWith" class="p2 fs-12">Replace with*</label>
            <ng-select id="replaceWith" class="custom" formControlName="ruleInputLogic1" [(ngModel)]="ruleInputLogic1"
                (change)="preview()" [clearable]="false">
                <ng-option *ngFor="let option of replaceOptions" [value]="option.value">{{option.text}}
                </ng-option>
            </ng-select>
        </div>
    </div>
    <div class="col-12">
        <div class="form-group" *ngIf="ruleInputLogic1 === ruleTypes.CustomValue">
            <label for="newValue" class="p2 fs-12">Custom value*</label>
            <input id="newValue" type="text" class="form-control cleansing-textbox" [(ngModel)]="ruleInputValues3"
                formControlName="ruleInputValues3" placeholder="Enter a new custom value" (change)="preview()">

            <ng-container *ngIf="fg.get('ruleInputValues3').touched ">
                <span class="text-error" *ngIf="fg.get('ruleInputValues3').hasError('required')">
                    This field is required
                </span>
            </ng-container>
        </div>
    </div>
    <div class="pd-l-15">
        <button id="btn-save" type="submit" class="btn btn-design mr-3" [ngClass]="{'disableAdd': !fg.valid}" 
            [disabled]="!fg.valid || submitted">{{ruleButtonLabel}}</button>
        <button id="btn-cancel" type="reset" class="btn cancelBtn" (click)="cancel()">Cancel</button>
    </div>
</form>
